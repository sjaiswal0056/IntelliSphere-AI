version: '3.8'

services:
  # ==============================================================================
  # Database Service — PostgreSQL 16
  # ==============================================================================
  db:
    image: postgres:16-alpine
    container_name: intellisphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intellisphere}
      POSTGRES_USER: ${POSTGRES_USER:-intellisphere_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellisphere_secure_password_2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intellisphere_user} -d ${POSTGRES_DB:-intellisphere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intellisphere-network

  # ==============================================================================
  # Application Service — Unified Predictive Intelligence Platform
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellisphere-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-intellisphere_user}:${POSTGRES_PASSWORD:-intellisphere_secure_password_2026!}@db:5432/${POSTGRES_DB:-intellisphere}
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-demo@intellisphere.ai}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - MLFLOW_TRACKING_URI=sqlite:///./data/mlflow.db
      - MLFLOW_EXPERIMENT_NAME=IntelliSphere-Unified-Platform
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8000}
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    networks:
      - intellisphere-network

volumes:
  postgres_data:
    driver: local

networks:
  intellisphere-network:
    driver: bridge
